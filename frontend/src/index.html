<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Escuela de Idiomas del Ejército</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Sistema de Gestión de Inscripciones - Escuela de Idiomas del Ejército, Cochabamba. Historia, Misión, Visión y Objetivos.">
  <meta name="theme-color" content="#1976d2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EIE">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="favicon.ico">

  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <app-root></app-root>
  <script>
    // MutationObserver to dynamically inject the hamburger menu button in the sidebar header on mobile
    const observer = new MutationObserver(() => {
      const header = document.querySelector('.sidebar-header');
      if (header && !header.querySelector('.mobile-hamburger-btn')) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mobile-hamburger-btn';
        btn.innerHTML = '<i class="material-icons-outlined">menu</i>';
        btn.setAttribute('aria-label', 'Abrir menú');
        header.appendChild(btn);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Global click listener to toggle mobile-open class on sidebar
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.mobile-hamburger-btn');
      if (btn) {
        const sidebar = document.querySelector('.sidebar');
        if (sidebar) {
          sidebar.classList.toggle('mobile-open');
          const icon = btn.querySelector('i');
          if (icon) {
            icon.textContent = sidebar.classList.contains('mobile-open') ? 'close' : 'menu';
          }
        }
      }
      
      // Close menu when clicking a nav item or logout button
      if (e.target.closest('.nav-item') || e.target.closest('.nav-btn') || e.target.closest('.btn-logout') || e.target.closest('.paralelo-nav-btn')) {
        const sidebar = document.querySelector('.sidebar');
        if (sidebar) {
          sidebar.classList.remove('mobile-open');
          const hamburger = document.querySelector('.mobile-hamburger-btn i');
          if (hamburger) hamburger.textContent = 'menu';
        }
      }
    });
  </script>
</body>
</html>
